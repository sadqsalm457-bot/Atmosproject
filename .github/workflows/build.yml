name: Build Atmos APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive (only when uploaded as a zip)
        run: |
          if [ ! -f pubspec.yaml ]; then
            ZIP="$(ls ./*.zip 2>/dev/null | head -n 1 || true)"
            if [ -z "$ZIP" ]; then
              echo "No pubspec.yaml and no .zip found in the repository root."
              exit 1
            fi
            unzip -o -q "$ZIP"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate android/ folder
        run: flutter create --platforms=android --org com.atmos --project-name atmos_weather .

      - name: Remove template test
        run: rm -f test/widget_test.dart

      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atmos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
